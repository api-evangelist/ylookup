aid: ylookup
name: Ylookup
description: >-
  Ylookup is a London-based fintech (founded 2025, EQT Ventures-backed) building an
  agentic workflow engine for fund administration, corporate services, tax, audit, and
  deal advisory firms. Its platform embeds trusted AI agents into existing tools (Excel,
  PDFs, Investran, Paxus) as a centralized processing layer — no data migration required —
  with specialized agents for extracting data from financial documents (LPAs, debt
  agreements, KYC/AML and tax forms), real-time reconciliation across spreadsheets and
  sources, financial analysis, and four-eye review. The company reports an average 76%
  time saved across live processes such as fund-accounting migration, client onboarding,
  financial-statement preparation, and K-1 data extraction. Ylookup publishes no public
  developer API, documentation, or SDKs at this time; this profile captures its identity
  and published security/compliance posture.
